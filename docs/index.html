function readStore(key) {

function writeStore(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* private mode */ }

function prefersStill() {
  return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function isWide() {
  return window.matchMedia("(min-width: 900px) and (min-height: 620px)").matches;
}

function buildViews() {
  var wide = isWide();
  if (!wide) {
    return pages.map(function (page, i) {
      return { right: page, left: null, single: true, closed: i === 0 };
    });
  }
  var out = [{ right: pages[0], left: null, single: true, closed: true }];
  for (var i = 1; i < pages.length; i += 2) {
    out.push({ right: pages[i], left: pages[i + 1] || null, single: false, closed: false });
  }
  return out;
}

function viewForPage(id) {
  for (var i = 0; i < views.length; i++) {
    var v = views[i];
    if ((v.right && v.right.id === id) || (v.left && v.left.id === id)) return i;
  }
  return 0;
}

  var v = views[viewIndex];
  return v && v.right ? v.right.id : pages[0].id;
}

      var balloon = document.createElement("p");
      balloon.className = "balloon";
      balloon.style.left = b.x + "%";
      balloon.style.top = b.y + "%";
      balloon.setAttribute("aria-hidden", "true");
      balloon.textContent = b.text;
      fig.appendChild(balloon);
    });
    if (panel.fly) {
      var a = document.createElement("a");
      a.className = "fly";
      a.href = panel.fly.href;
      a.setAttribute("aria-label", panel.fly.name);
      a.textContent = panel.fly.label;
      fig.appendChild(a);
    }
    var transcript = document.createElement("p");
    transcript.className = "transcript";
    transcript.textContent = panel.transcript;
    fig.appendChild(transcript);
    stack.appendChild(fig);
  });
  art.appendChild(stack);
  if (page.cover) {
    var by = document.createElement("p");
    by.className = "cover-by";
    by.textContent = "andAgainFPV";
    art.appendChild(by);
  }
  if (page.folio) {
    var folio = document.createElement("p");
    folio.className = "folio " + (side === "left" ? "folio-left" : "folio-right");
    folio.textContent = page.folio;
    art.appendChild(folio);
  }
  return art;
}

function endpaper() {
  var d = document.createElement("div");
  d.className = "endpaper";
  d.setAttribute("aria-hidden", "true");
  return d;
}

function clonePage(node) {
  var c = node.cloneNode(true);
  c.querySelectorAll("[id]").forEach(function (el) { el.removeAttribute("id"); });
  return c;
}

function fit() {
  var stage = document.getElementById("stage");
  var rect = stage.getBoundingClientRect();
  var view = views[viewIndex];
  var across = view && !view.single ? 2 : 1;
  var gutterW = across === 2 ? 28 : 0;
  var availW = Math.max(160, rect.width - 4);
  var availH = Math.max(160, rect.height - 4);
  var pageW = (availW - gutterW) / across;
  var pageH = pageW * 1.5;
  if (pageH > availH) {
    pageH = availH;
    pageW = pageH / 1.5;
  }
  book.style.width = (pageW * across + gutterW) + "px";
  book.style.height = pageH + "px";
  gutter.style.flexBasis = gutterW + "px";
}

function whereText(view) {
  if (view.closed && view.single && view.right && view.right.cover) return "The gate, cover";
  if (view.single) return "The gate, " + view.right.where;
  if (view.left) return "The gate, right " + view.right.where + ", then left " + view.left.where;
  return "The gate, right " + view.right.where;
}

function paint(view) {
  var single = !!view.single;
  book.classList.toggle("single", single);
  book.classList.toggle("spread-mode", !single);
  book.classList.toggle("closed", !!view.closed);
  leftSheet.hidden = single;
  gutter.hidden = single;
  rightSheet.replaceChildren(pageEl(view.right, "right"));
  if (!single) {
    leftSheet.replaceChildren(view.left ? pageEl(view.left, "left") : endpaper());
  }
  fit();
  whereEl.textContent = whereText(view);
  prevBtn.disabled = viewIndex <= 0;
  nextBtn.disabled = viewIndex >= views.length - 1;
  var anchor = view.right.id;
  if (location.hash !== "#" + anchor) {
    history.replaceState(null, "", "#" + anchor);
  }
  preloadAround();
}

function preloadAround() {
  [-1, 0, 1].forEach(function (delta) {
    var v = views[viewIndex + delta];
    if (!v) return;
    [v.right, v.left].forEach(function (page) {
      if (!page) return;
      page.panels.forEach(function (panel) {
        if (!panel.src) return;
        var img = new Image();
        img.src = panel.src;
        var hi = new Image();
        hi.src = panel.src.replace("@1x", "@2x");
      });
    });
  });
}

function can(dir) {
  var next = viewIndex + dir;
  return next >= 0 && next < views.length;
}

function shapeChanges(dir) {
  var from = views[viewIndex];
  var to = views[viewIndex + dir];
  if (!from || !to) return false;
  return !!from.single !== !!to.single;
}

function blankFace() {
  var d = document.createElement("div");
  d.className = "page";
  return d;
}

function placeLeaf(side) {
  var host = side === "left" ? leftSheet : rightSheet;
  var b = book.getBoundingClientRect();
  var s = host.getBoundingClientRect();
  leaf.style.left = (s.left - b.left) + "px";
  leaf.style.top = (s.top - b.top) + "px";
  leaf.style.width = s.width + "px";
  leaf.style.height = s.height + "px";
}

function bendGradient(originRight) {
  if (originRight) {
    return "linear-gradient(270deg, rgba(12,18,14,0.42), rgba(12,18,14,0.05) 20%, rgba(255,255,255,0.18) 68%, rgba(12,18,14,0.14))";
  }
  return "linear-gradient(90deg, rgba(12,18,14,0.42), rgba(12,18,14,0.05) 20%, rgba(255,255,255,0.18) 68%, rgba(12,18,14,0.14))";
}

function applyProgress(dir, p, instant, fromView) {
  var from = fromView || views[viewIndex];
  var originRight;
  var angle;
  if (from.single) {
    originRight = dir < 0;
    angle = dir > 0 ? -180 * p : 180 * p;
  } else if (dir > 0) {
    originRight = true;
    angle = 180 * p;
  } else {
    originRight = false;
    angle = -180 * p;
  }
  if (from.single) angle = dir > 0 ? -88 * p : 88 * p;
  leaf.style.transformOrigin = originRight ? "right center" : "left center";
  leaf.style.transition = instant ? "none" : "transform 680ms cubic-bezier(.22,.7,.2,1), opacity 680ms linear";
  leaf.style.transform = "rotateY(" + angle + "deg)";
  leaf.style.opacity = from.single ? String(1 - Math.max(0, (p - 0.28) / 0.72)) : "1";
  leafBack.hidden = !!from.single;
  var bend = leafFront.querySelector(".bend");
  if (bend) {
    bend.style.background = bendGradient(originRight);
    bend.style.opacity = String(Math.sin(Math.PI * p) * 0.9);
  }
}

function addBend() {
  var bend = document.createElement("div");
  bend.className = "bend";
  leafFront.appendChild(bend);
}

function beginLeaf(dir) {
  var from = views[viewIndex];
  var to = views[viewIndex + dir];
  var side = from.single ? "right" : (dir > 0 ? "left" : "right");
  var host = side === "left" ? leftSheet : rightSheet;
  var snapshot = host.firstElementChild ? clonePage(host.firstElementChild) : blankFace();
  if (from.single) {
    rightSheet.replaceChildren(pageEl(to.right, "right"));
    book.classList.toggle("closed", !!to.closed);
  } else if (dir > 0) {
    leftSheet.replaceChildren(to.left ? pageEl(to.left, "left") : endpaper());
  } else {
    rightSheet.replaceChildren(pageEl(to.right, "right"));
  }
  leafFront.replaceChildren(snapshot);
  addBend();
  var land = from.single ? to.right : (dir > 0 ? to.right : (to.left || null));
  if (land) leafBack.replaceChildren(pageEl(land, dir > 0 ? "right" : "left"));
  else leafBack.replaceChildren(endpaper());
  leaf.hidden = false;
  placeLeaf(side);
  applyProgress(dir, 0, true, from);
  book.classList.add("turning");
  return from;
}

function waitTransition(ms) {
  return new Promise(function (resolve) {
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      leaf.removeEventListener("transitionend", onEnd);
      resolve();
    }
    function onEnd(e) {
      if (e.propertyName === "transform" && e.target === leaf) finish();
    }
    leaf.addEventListener("transitionend", onEnd);
    setTimeout(finish, ms);
  });
}

function commit(dir) {
  viewIndex += dir;
  leaf.hidden = true;
  leaf.style.transition = "none";
  leaf.style.transform = "none";
  leaf.style.opacity = "1";
  leafBack.hidden = false;
  leafFront.replaceChildren();
  leafBack.replaceChildren();
  book.classList.remove("turning");
  paint(views[viewIndex]);
  busy = false;
  rustle();
}

function turn(dir) {
  if (busy || !can(dir)) return;
  if (!motion || shapeChanges(dir)) {
    fadeTo(viewIndex + dir);
    return;
  }
  busy = true;
  var from = beginLeaf(dir);
  applyProgress(dir, 1, false, from);
  waitTransition(820).then(function () { commit(dir); });
}

function fadeTo(next) {
  busy = true;
  book.classList.add("fade");
  setTimeout(function () {
    viewIndex = next;
    paint(views[viewIndex]);
    book.classList.remove("fade");
    busy = false;
  }, 180);
}

function goToId(id) {
  if (busy) return;
  var idx = viewForPage(id);
  contentsEl.hidden = true;
  contentsBtn.setAttribute("aria-expanded", "false");
  if (idx === viewIndex) return;
  if (Math.abs(idx - viewIndex) === 1) turn(idx > viewIndex ? 1 : -1);
  else fadeTo(idx);
}

function rustle() {
  if (!soundOn) return;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  if (!audioCtx) audioCtx = new Ctx();
  var dur = 0.16;
  var rate = audioCtx.sampleRate;
  var buf = audioCtx.createBuffer(1, Math.floor(rate * dur), rate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < data.length; i++) {
    var t = i / data.length;
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2) * 0.22;
  }
  var src = audioCtx.createBufferSource();
  src.buffer = buf;
  var filter = audioCtx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 1600;
  filter.Q.value = 0.7;
  src.connect(filter);
  filter.connect(audioCtx.destination);
  src.start();
}

function buildContents() {
  contentsEl.replaceChildren();
  var title = document.createElement("p");
  title.className = "contents-title";
  title.textContent = "Contents";
  contentsEl.appendChild(title);
  CHAPTERS.forEach(function (ch) {
    var head = document.createElement("p");
    head.className = "contents-chapter";
    head.textContent = ch.title;
    contentsEl.appendChild(head);
    ch.pages.forEach(function (p) {
      var a = document.createElement("a");
      a.href = "#" + p.id;
      a.textContent = p.contentsLabel;
      a.addEventListener("click", function (e) {
        e.preventDefault();
        goToId(p.id);
      });
      contentsEl.appendChild(a);
    });
  });
}

function setMotion(on) {
  motion = on;
  motionBtn.setAttribute("aria-pressed", on ? "true" : "false");
  motionBtn.textContent = on ? "Motion on" : "Motion off";
  document.body.classList.toggle("still", !on);
}

function onKey(e) {
  var tag = e.target && e.target.closest ? e.target.closest("a, button, input, textarea") : null;
  if (e.key === "Escape") {
    contentsEl.hidden = true;
    contentsBtn.setAttribute("aria-expanded", "false");
    if (document.body.classList.contains("as-text")) {
      document.body.classList.remove("as-text");
      textBtn.setAttribute("aria-pressed", "false");
      textBtn.textContent = "Read as text";
    }
    return;
  }
  if (tag && (e.key === " " || e.key === "Enter")) return;
  if (contentsEl.hidden === false && (e.key === "ArrowDown" || e.key === "ArrowUp")) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    e.preventDefault();
    turn(1);
  } else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") {
    e.preventDefault();
    turn(-1);
  } else if (e.key === "Home") {
    e.preventDefault();
    goToId(pages[0].id);
  } else if (e.key === "End") {
    e.preventDefault();
    goToId(pages[pages.length - 1].id);
  }
}

book.addEventListener("pointerdown", function (e) {
  if (busy) return;
  if (e.button !== undefined && e.button !== 0) return;
  if (e.target.closest("a, button")) return;
  e.preventDefault();
  var rect = book.getBoundingClientRect();
  drag = {
    id: e.pointerId,
    x: e.clientX,
    y: e.clientY,
    rect: rect,
    moved: false,
    dir: 0,
    progress: 0,
    from: null
  };
  if (book.setPointerCapture) {
    try { book.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }
});

book.addEventListener("pointermove", function (e) {
  if (!drag || e.pointerId !== drag.id || busy && drag.dir === 0) return;
  var dx = e.clientX - drag.x;
  var dy = e.clientY - drag.y;
  if (drag.fade) {
    var fadeWidth = Math.max(120, drag.rect.width * 0.7);
    drag.progress = Math.max(0, Math.min(1, Math.abs(dx) / fadeWidth));
    book.style.opacity = String(1 - drag.progress * 0.65);
    return;
  }
  if (!drag.moved && Math.hypot(dx, dy) < 10) return;
  if (!drag.dir) {
    var dir = dx < 0 ? 1 : -1;
    if (!can(dir)) {
      drag.moved = true;
      drag.dir = 0;
      return;
    }
    if (!motion || shapeChanges(dir)) {
      drag.moved = true;
      drag.dir = dir;
      drag.fade = true;
      drag.progress = 0;
      return;
    }
    busy = true;
    drag.dir = dir;
    drag.from = beginLeaf(dir);
  }
  if (!drag.dir) {
    drag.moved = true;
    return;
  }
  drag.moved = true;
  var width = Math.max(120, drag.rect.width * (views[viewIndex].single ? 0.7 : 0.45));
  drag.progress = Math.max(0, Math.min(1, Math.abs(dx) / width));
  applyProgress(drag.dir, drag.progress, true, drag.from);
});

function endDrag(e) {
  if (!drag || (e && e.pointerId !== undefined && e.pointerId !== drag.id)) return;
  var d = drag;
  drag = null;
  if (!d.moved) {
    var localX = d.x - d.rect.left;
    var dir = localX > d.rect.width / 2 ? 1 : -1;
    turn(dir);
    return;
  }
  if (d.fade && d.dir) {
    book.style.opacity = "1";
    if (d.progress > 0.32) fadeTo(viewIndex + d.dir);
    return;
  }
  if (!d.dir) return;
  if (d.progress > 0.32) {
    applyProgress(d.dir, 1, false, d.from);
    waitTransition(820).then(function () { commit(d.dir); });
  } else {
    applyProgress(d.dir, 0, false, d.from);
    waitTransition(460).then(function () {
      leaf.hidden = true;
      leaf.style.transform = "none";
      leaf.style.opacity = "1";
      leafBack.hidden = false;
      leafFront.replaceChildren();
      leafBack.replaceChildren();
      book.classList.remove("turning");
      paint(views[viewIndex]);
      busy = false;
    });
  }
}

book.addEventListener("pointerup", endDrag);
book.addEventListener("pointercancel", endDrag);

prevBtn.addEventListener("click", function () { turn(-1); });
nextBtn.addEventListener("click", function () { turn(1); });
contentsBtn.addEventListener("click", function () {
  var open = contentsEl.hidden;
  contentsEl.hidden = !open;
  contentsBtn.setAttribute("aria-expanded", open ? "true" : "false");
});
textBtn.addEventListener("click", function () {
  var on = !document.body.classList.contains("as-text");
  document.body.classList.toggle("as-text", on);
  textBtn.setAttribute("aria-pressed", on ? "true" : "false");
  textBtn.textContent = on ? "Show pictures" : "Read as text";
  writeStore("webfpv-book-text", on ? "1" : "0");
});
motionBtn.addEventListener("click", function () {
  setMotion(!motion);
  writeStore("webfpv-book-motion", motion ? "1" : "0");
});
soundBtn.addEventListener("click", function () {
  soundOn = !soundOn;
  soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
  soundBtn.textContent = soundOn ? "Sound on" : "Sound off";
  writeStore("webfpv-book-sound", soundOn ? "1" : "0");
  if (soundOn) rustle();
});
document.addEventListener("keydown", onKey);
window.addEventListener("resize", function () {
  var id = currentAnchor();
  views = buildViews();
  viewIndex = viewForPage(id);
  paint(views[viewIndex]);
});

var storedMotion = readStore("webfpv-book-motion");
if (storedMotion === "0" || (storedMotion === null && prefersStill())) setMotion(false);
else setMotion(true);
if (readStore("webfpv-book-text") === "1") {
  document.body.classList.add("as-text");
  textBtn.setAttribute("aria-pressed", "true");
  textBtn.textContent = "Show pictures";
}
if (readStore("webfpv-book-sound") === "1") {
  soundOn = true;
  soundBtn.setAttribute("aria-pressed", "true");
  soundBtn.textContent = "Sound on";
}

buildContents();
views = buildViews();
var start = (location.hash || "").replace("#", "");
viewIndex = start ? viewForPage(start) : 0;
book.hidden = false;
paint(views[viewIndex]);
</script>
<!--
MAINTAINERS
The book is this file. Chapter data is the CHAPTERS array above.
To add a chapter, append one object and put the inked images in
docs/assets/chapters/<id>/ as <panel>@1x.webp and <panel>@2x.webp.
Each panel needs an id, an alt, and a transcript. A picture panel
also needs a src. A factual balloon needs a source. Narration stays
in balloons. It is not baked into the pictures.
On a wide screen the right page is read first, then the left page.
Inside a page the order is top to bottom.
The last page keeps one link to https://webfpv.org/sim/ and an empty
Next panel until the next chapter exists. When chapter 10 is drawn,
that ending moves there.
Recapture with: node tools/fly/run.js c1
Re-ink with: node tools/ink/ink.js
Research, raw captures, and tools stay outside docs/.
