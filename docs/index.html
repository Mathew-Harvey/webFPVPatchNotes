<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebFPV, the comic</title>
<meta name="description" content="A manga about WebFPV, the free browser FPV simulator, in the words of andAgainFPV, the pilot who built it. Chapter 1: Fly decent.">
<meta name="theme-color" content="#0c120e">
<!--
  The comic's look is the front door's (webfpv.org): the first screen there
  is a manga page, and every page here is one. Paper, ink borders, gutters
  that lean, the simulator's own pictures in the panels, the lettering in
  the simulator's hand. The tokens below are the front door's :root, the
  page numbers are its src/page.js, and like it this page ships no font:
  the lettering is the system's heaviest sans used as a skeleton.
-->
<style>
:root {
  --cream: #f3ead4;
  --sakura: #e8a8b8;
  --amber: #ffd45c;
  --mint: #7dffb4;
  --slate: #9db3c8;
  --deep: #141c16;
  --ink: #0c120e;
  --paper: #f7f0dc;
  --page-ink: #0b1116;
  --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --pw: 600px;
  --bar: 52px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--ink);
  color: var(--cream);
  font-family: var(--ui-font);
}
body {
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 45%, #1b251d 0%, var(--ink) 70%);
  -webkit-tap-highlight-color: transparent;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.skip {
  position: absolute;
  left: 12px;
  top: -60px;
  z-index: 50;
  padding: 10px 14px;
  background: var(--paper);
  color: var(--page-ink);
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-size: 12px;
}
.skip:focus { top: 12px; }
:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

/* ------------------------------------------------------------------
   THE BAR. The front door's top bar: the lettered mark on the left, the
   rest small, spaced capitals. It stays out of the page's way.
   ------------------------------------------------------------------ */
.bar {
  position: fixed;
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 max(14px, env(safe-area-inset-left)) 0 max(14px, env(safe-area-inset-right));
  height: var(--bar);
  pointer-events: none;
}
.bar > * { pointer-events: auto; }
.bar.top { top: 0; justify-content: space-between; }
.bar.bottom { bottom: 0; justify-content: center; gap: 14px; }
.mark { display: block; width: 112px; height: 30px; }
.mark svg { display: block; width: 100%; height: 100%; overflow: visible; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.btn {
  appearance: none;
  font: 800 11px/1 var(--ui-font);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(243, 234, 212, 0.86);
  background: rgba(16, 22, 17, 0.72);
  border: 1px solid rgba(243, 234, 212, 0.22);
  min-height: 34px;
  padding: 0 12px;
  cursor: pointer;
}
.btn:hover { color: var(--cream); border-color: rgba(232, 168, 184, 0.7); }
.btn[aria-pressed="true"] { color: var(--page-ink); background: var(--sakura); border-color: var(--sakura); }
.btn:disabled { opacity: 0.3; cursor: default; }
.turn { min-width: 74px; min-height: 40px; }
#where {
  margin: 0;
  min-width: 12em;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(157, 179, 200, 0.95);
}

/* ------------------------------------------------------------------
   THE STAGE AND THE BOOK. One page on a phone, a spread on a wide
   window. --pw is the page's width in pixels and everything on a page is
   a share of it, so the drawing never reflows.
   ------------------------------------------------------------------ */
#stage {
  position: fixed;
  left: 0;
  right: 0;
  top: var(--bar);
  bottom: var(--bar);
  display: flex;
  align-items: center;
  justify-content: center;
}
#book {
  position: relative;
  height: calc(var(--pw) * 1.414);
  perspective: calc(var(--pw) * 4.5);
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
}
#book.dragging { cursor: grabbing; }
.shift {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
}
.slot {
  position: absolute;
  top: 0;
  width: var(--pw);
  height: 100%;
}
.slot.left { left: 0; }
.slot.right { left: var(--pw); }
.slot.single { left: 0; }
/* The fold: a spread darkens a little towards the spine on both pages. */
.spread .slot.left::after,
.spread .slot.right::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 9%;
  pointer-events: none;
  z-index: 30;
}
.spread .slot.left::after { right: 0; background: linear-gradient(to left, rgba(11, 17, 22, 0.22), rgba(11, 17, 22, 0)); }
.spread .slot.right::after { left: 0; background: linear-gradient(to right, rgba(11, 17, 22, 0.24), rgba(11, 17, 22, 0)); }
.slot:empty::after { display: none; }
.leaf {
  position: absolute;
  top: 0;
  left: var(--pw);
  width: var(--pw);
  height: 100%;
  transform-origin: 0 50%;
  transform-style: preserve-3d;
  z-index: 40;
}
.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.face.back { transform: rotateY(180deg); }
.face .shade {
  position: absolute;
  inset: 0;
  z-index: 35;
  pointer-events: none;
  opacity: 0;
}
.face.front .shade { background: linear-gradient(to right, rgba(11, 17, 22, 0.55), rgba(11, 17, 22, 0.05) 60%, rgba(11, 17, 22, 0)); }
.face.back .shade { background: linear-gradient(to left, rgba(11, 17, 22, 0.55), rgba(11, 17, 22, 0.05) 60%, rgba(11, 17, 22, 0)); }
.cast {
  position: absolute;
  inset: 0;
  z-index: 34;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(to right, rgba(11, 17, 22, 0.42), rgba(11, 17, 22, 0) 45%);
}
.track {
  position: absolute;
  inset: 0;
}

/* ------------------------------------------------------------------
   A PAGE. Paper, then the panels, then the ink, the lettering, the
   balloons and the words, each a layer. Every size is in cqw, a
   hundredth of the page's width; a page unit is 0.1cqw.
   ------------------------------------------------------------------ */
.page {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--paper);
  color: var(--page-ink);
  container-type: inline-size;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5), 0 2px 0 rgba(0, 0, 0, 0.2);
}
.page.tone-night { background: var(--page-ink); }
.panel {
  position: absolute;
  margin: 0;
  overflow: hidden;
  z-index: 1;
  background: #cfc6b0;
}
.panel.fill-ink { background: var(--page-ink); }
.panel.fill-paper { background: var(--paper); }
.panel img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}
.panel.negative img { filter: grayscale(1) invert(1) contrast(2.1) brightness(1.06); }
.panel.missing { background: repeating-linear-gradient(45deg, #d9d0b8 0 6px, #cfc6ad 6px 12px); }
.panel.missing::after {
  content: attr(data-art);
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font: 700 1.6cqw/1 var(--mono);
  color: rgba(11, 17, 22, 0.5);
}
.panel .fx {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.panel a.go {
  position: absolute;
  inset: 0;
  z-index: 2;
}
.panel a.go:focus-visible { outline: none; box-shadow: inset 0 0 0 0.8cqw var(--mint); }
svg.layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}
svg.borders { z-index: 2; }
svg.letters { z-index: 3; }
svg.bubbles { z-index: 4; }
.borders polygon {
  fill: none;
  stroke: var(--page-ink);
  stroke-width: 6.5;
  stroke-linejoin: miter;
  stroke-miterlimit: 8;
}
.tone-night .borders polygon { stroke: var(--paper); stroke-width: 2.6; }
.bubbles path, .bubbles circle {
  fill: #fffdf6;
  stroke: var(--page-ink);
  stroke-width: 4.2;
  stroke-linejoin: round;
}
.w { position: absolute; z-index: 5; margin: 0; }
/* The narration box, the square balloon a manga page gives a caption:
   typeset, not lettered, as the front door's act numbers are. */
.cap {
  padding: 1.05cqw 1.35cqw 1.1cqw;
  font-size: calc(2.55cqw + 0.1rem);
  font-weight: 700;
  line-height: 1.28;
  color: var(--page-ink);
  background: var(--paper);
  border: 0.32cqw solid var(--page-ink);
}
.cap.big {
  padding: 1.8cqw 2.2cqw 1.9cqw;
  font-size: calc(3.9cqw + 0.1rem);
  font-weight: 800;
  line-height: 1.18;
  text-align: center;
  color: var(--cream);
  background: var(--page-ink);
}
.note { display: flex; flex-direction: column; align-items: flex-start; }
.note .d {
  display: inline-block;
  margin: 0 0 -0.32cqw 1.4cqw;
  padding: 0.65cqw 0.9cqw 0.55cqw;
  font: 700 calc(1.35cqw + 0.05rem)/1 var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--page-ink);
  background: var(--amber);
  border: 0.28cqw solid var(--page-ink);
  position: relative;
  z-index: 1;
}
.note .t {
  padding: 1.05cqw 1.35cqw 1.1cqw;
  font-size: calc(2.35cqw + 0.1rem);
  font-weight: 700;
  line-height: 1.28;
  color: var(--page-ink);
  background: var(--paper);
  border: 0.32cqw solid var(--page-ink);
}
.note.small .t { font-size: calc(1.95cqw + 0.08rem); padding: 0.8cqw 1.1cqw 0.85cqw; }
.note.small .d { font-size: calc(1.2cqw + 0.05rem); }
/* The front door's eyebrow on paper, and its world tags. */
.tag {
  padding: 0.62cqw 0.95cqw 0.55cqw;
  font-size: calc(1.45cqw + 0.06rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--page-ink);
  background: var(--paper);
  border: 0.24cqw solid var(--page-ink);
}
.head {
  font-size: calc(2.9cqw + 0.1rem);
  font-weight: 750;
  line-height: 1.22;
  color: var(--page-ink);
}
.sub {
  font-size: calc(2.2cqw + 0.08rem);
  font-weight: 500;
  line-height: 1.3;
  color: rgba(11, 17, 22, 0.78);
}
.sub.night { color: rgba(243, 234, 212, 0.86); }
.sub.center { text-align: center; }
.bt {
  font-size: calc(2.7cqw + 0.1rem);
  font-weight: 800;
  line-height: 1.12;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--page-ink);
}
.fly {
  position: absolute;
  z-index: 6;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 13cqw;
  min-height: 44px;
  padding: 1.4cqw 3cqw 1.3cqw;
  font-size: calc(2.6cqw + 0.1rem);
  font-weight: 800;
  letter-spacing: 0.18em;
  color: var(--page-ink);
  background: var(--mint);
  border: 0.4cqw solid var(--page-ink);
  box-shadow: 0.6cqw 0.7cqw 0 var(--page-ink);
  text-decoration: none;
}
.fly:hover { filter: brightness(1.06); }
.fly:focus-visible { outline: 0.5cqw solid var(--page-ink); outline-offset: 0.5cqw; }
.folio {
  position: absolute;
  z-index: 5;
  bottom: 1.1cqw;
  font: 700 calc(1.15cqw + 0.05rem)/1 var(--mono);
  letter-spacing: 0.12em;
  color: rgba(11, 17, 22, 0.55);
}
.folio.l { left: 3.6cqw; }
.folio.r { right: 3.6cqw; }
.tone-night .folio { color: rgba(243, 234, 212, 0.5); }

/* ------------------------------------------------------------------
   CONTENTS AND THE SCRIPT.
   ------------------------------------------------------------------ */
.sheet {
  position: fixed;
  z-index: 30;
  top: calc(var(--bar) + 6px);
  right: 12px;
  width: min(330px, calc(100vw - 24px));
  max-height: calc(100vh - 2 * var(--bar) - 12px);
  overflow: auto;
  padding: 16px 18px 18px;
  background: var(--paper);
  color: var(--page-ink);
  border: 3px solid var(--page-ink);
  box-shadow: 6px 7px 0 rgba(11, 17, 22, 0.9);
}
.sheet[hidden] { display: none; }
.sheet h2 {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.sheet ol { margin: 0; padding: 0; list-style: none; }
.sheet li a {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  min-height: 36px;
  align-items: center;
  padding: 0 6px;
  color: var(--page-ink);
  text-decoration: none;
  font-weight: 650;
  font-size: 15px;
  border-bottom: 1px solid rgba(11, 17, 22, 0.12);
}
.sheet li a:hover, .sheet li a[aria-current="true"] { background: rgba(232, 168, 184, 0.35); }
.sheet li a span { font: 700 11px/1 var(--mono); color: rgba(11, 17, 22, 0.55); }
#script {
  position: fixed;
  inset: var(--bar) 0 var(--bar);
  z-index: 25;
  overflow: auto;
  background: var(--paper);
  color: var(--page-ink);
}
#script[hidden] { display: none; }
#script .in { max-width: 44em; margin: 0 auto; padding: 28px 22px 60px; }
#script h2 {
  margin: 34px 0 12px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #4b5763;
}
#script p { margin: 0 0 10px; font-size: 18px; line-height: 1.55; }
#script .alt { color: #4b5763; font-style: italic; font-size: 16px; }
#script .said { font-weight: 700; }
#script .fx { font-weight: 800; letter-spacing: 0.08em; }
#script a.fly { position: static; margin-top: 12px; }

@media (max-width: 640px) {
  :root { --bar: 46px; }
  .tools .wide { display: none; }
  #where { min-width: 0; font-size: 10px; letter-spacing: 0.12em; }
  .turn { min-width: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  .btn, .fly { transition: none; }
}
</style>
</head>

    <button type="button" class="btn" id="contents-btn" aria-expanded="false" aria-controls="contents">Contents</button>
    <button type="button" class="btn" id="text-btn" aria-pressed="false">Read as text</button>

</header>
<main id="stage">

</main>
<footer class="bar bottom">
  <button type="button" class="btn turn" id="prev" aria-label="Previous page">Back</button>
  <p id="where" aria-live="polite"></p>

</footer>
<nav id="contents" class="sheet" aria-label="Contents" hidden></nav>
<article id="script" aria-label="The book as text" hidden><div class="in"></div></article>
<noscript>
  <style>#stage, .bar { display: none; } body { overflow: auto; background: var(--paper); color: var(--page-ink); }</style>
  <div style="max-width: 44em; margin: 0 auto; padding: 28px 22px 60px; font-size: 18px; line-height: 1.55;">
    <h1>WebFPV. Chapter 1: Fly decent.</h1>
    <p>This book draws its pages with JavaScript. With it off, here are the words.</p>
    <p>Mat. andAgainFPV. A pilot since 2020.</p>
    <p>It started as curiosity. Could I compile Betaflight and put it in a virtual world, in a browser, and fly decent?</p>
    <p>Betaflight 4.5.1, compiled to WebAssembly. The PID loop runs at 1 kHz. Yes. 11 August 2026.</p>
    <p>Soon as I realised the answer was yes, I decided to see how far we could go. It was then a project.</p>
    <p>First it was for me. I wanted a sim that was super easy to fly in. For my kids, and for me.</p>
    <p>Then I realised that most school kids have no money, and usually can't install stuff on their computers, so they have no sim to fly in. Then I wanted it to be accessible for all the people that could not buy a VelociDrone, or what not.</p>
    <p>The part I'm proudest of is the map and track building system. So people could create their own game.</p>
    <p>What nearly made me quit was trying to understand the feel difference between real life whoops and the sim. It's different. But how?</p>
    <p>The testers found bugs and gave feedback on the flight feel, in a chat channel: Asylum, Jannes, LeStar and CrapShack. That helped me direct my development effort.</p>
    <p>If it feels like a real quad, the rest is easy.</p>
    <p>The game will keep building.</p>
    <p><a href="https://webfpv.org/sim/">Fly WebFPV</a></p>
  </div>
</noscript>
<script src="layout.js"></script>
<script src="chapters.js"></script>
<script>
/*
 * The reader. Lays each page out from docs/layout.js, draws it from
 * docs/chapters.js, and turns it: a spread on a wide window, one page on a
 * narrow one, by a click, a drag, a swipe or a key.
 *
 * This file is part of the WebFPV comic. Copyright 2026 Mathew Harvey
 * (andAgainFPV). Licensed under CC BY-ND 4.0, see LICENSE.
 */
(function () {
  'use strict';

  var SVGNS = 'http://www.w3.org/2000/svg';
  var PAGE_W = WebFPVLayout.PAGE_W;
  var PAGE_H = WebFPVLayout.PAGE_H;
  var ASSETS = 'assets/chapters/';
  var COLOURS = {
    cream: '#f3ead4', sakura: '#e8a8b8', amber: '#ffd45c', mint: '#7dffb4',
    slate: '#9db3c8', paper: '#f7f0dc', ink: '#0b1116'
  };
  var INK = '#0b1116';
  var PAPER = '#f7f0dc';
  var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function sv(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }
  function px(v, of) { return (v / of * 100).toFixed(3) + '%'; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* A number in [0, 1) that is a pure function of a string and an index, so
   * a word always wears the same hand and a page always draws the same lines. */
  function hash(str, i) {
    var h = (2166136261 ^ Math.imul(i + 1, 374761393)) >>> 0;
    for (var k = 0; k < str.length; k += 1) {
      h ^= str.charCodeAt(k);
      h = Math.imul(h, 16777619);
    }
    h ^= h >>> 13;
    h = Math.imul(h, 0x5bd1e995);
    h ^= h >>> 15;
    return (h >>> 0) / 4294967296;
  }

  /* ------------------------------------------------------------------ *
   * THE HAND. The simulator's lettering (src/ui/lettering.js there), drawn
   * here as vector so it is sharp at every size: the system's heaviest sans
   * as a skeleton, set one glyph at a time and a little tight, each glyph
   * slanted by a shear of 0.24, turned, lifted and scaled by a pure
   * function of the word, then inked: a hard ink drop down and right, an ink
   * outline a fifth of the size round every glyph before any is filled, and
   * two cel bands with a hard stop at 55 per cent of the cap height.
   * ------------------------------------------------------------------ */
  var SLANT_DEG = -Math.atan(0.24) * 180 / Math.PI;
  var INK_W = 0.2;
  var DROP_X = 0.07;
  var DROP_Y = 0.09;
  var measurer = null;
  function advanceOf(ch, size) {
    if (!measurer) measurer = document.createElement('canvas').getContext('2d');
    measurer.font = '900 100px ' + FONT;
    return measurer.measureText(ch).width / 100 * size * (ch === ' ' ? 0.62 : 0.95);
  }
  function shadeOf(hex, k) {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.round(((n >> 16) & 255) * k);
    var g = Math.round(((n >> 8) & 255) * k);
    var b = Math.round((n & 255) * k);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }
  var gradientSeq = 0;
  function letter(w, defs) {
    var size = w.size;
    var runs = w.runs.map(function (r) { return { t: r[0], fill: COLOURS[r[1]] || r[1] }; });
    var text = runs.map(function (r) { return r.t; }).join('');
    var chars = Array.from(text);
    var runOf = [];
    runs.forEach(function (r, k) { Array.from(r.t).forEach(function () { runOf.push(k); }); });
    var adv = chars.map(function (ch) { return advanceOf(ch, size); });
    var total = adv.reduce(function (a, b) { return a + b; }, 0);
    var x0 = w.anchor === 'start' ? 0 : (w.anchor === 'end' ? -total : -total / 2);
    var seed = w.seed || text;
    var g = sv('g', { transform: 'translate(' + w.x + ' ' + w.y + ') rotate(' + (w.rot || 0) + ')' });

    var gx = x0;

      var a = adv[i];
      if (ch !== ' ') {
        var rot = (hash(seed, i * 3) - 0.5) * 0.085 * 180 / Math.PI;
        var lift = (hash(seed, i * 3 + 1) - 0.5) * 0.07 * size;
        var sc = (i === 0 ? 1.08 : 1) + (hash(seed, i * 3 + 2) - 0.5) * 0.05;

        x: 0, y: 0,

        'font-weight': 900,
        'font-size': size.toFixed(1),
        transform: 'translate(' + (p.x + dx).toFixed(1) + ' ' + (p.y + dy).toFixed(1) + ') rotate(' + p.rot.toFixed(2) + ') skewX(' + SLANT_DEG.toFixed(2) + ') scale(' + p.sc.toFixed(3) + ')'
      }, attrs));
      t.textContent = p.ch;
      return t;
    }
    var ink = size * (w.inkW || INK_W);
    if (w.rim) {
      places.forEach(function (p) {
        g.appendChild(glyph(p, 0, 0, { fill: PAPER, stroke: PAPER, 'stroke-width': (ink * 2.1).toFixed(1), 'stroke-linejoin': 'round' }));
      });
    }
    places.forEach(function (p) {
      g.appendChild(glyph(p, size * DROP_X, size * DROP_Y, { fill: INK, stroke: INK, 'stroke-width': ink.toFixed(1), 'stroke-linejoin': 'round' }));
    });
    places.forEach(function (p) {
      g.appendChild(glyph(p, 0, 0, { fill: 'none', stroke: INK, 'stroke-width': ink.toFixed(1), 'stroke-linejoin': 'round' }));

  }

  /* ------------------------------------------------------------------ *
   * LINES. Focus lines and speed streaks, the simulator's manga layer's
   * strokes drawn as ink wedges, STILL, as the front door's are: drawn from
   * a seeded hash, so a page is the same page every time it opens.
   * ------------------------------------------------------------------ */
  function fxSvg(panel, box, pageId) {
    var s = sv('svg', { class: 'fx', viewBox: box.x.toFixed(1) + ' ' + box.y.toFixed(1) + ' ' + box.w.toFixed(1) + ' ' + box.h.toFixed(1), preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    (panel.fx || []).forEach(function (f, k) {
      var seed = pageId + panel.id + k;
      var gr = sv('g', { fill: f.colour ? (COLOURS[f.colour] || f.colour) : INK, opacity: f.alpha != null ? f.alpha : 0.8 });
      var diag = Math.hypot(box.w, box.h);
      var i;
      if (f.k === 'focus') {
        var cx = box.x + box.w * f.at[0];
        var cy = box.y + box.h * f.at[1];
        var rx = box.w * f.r[0];
        var ry = box.h * f.r[1];
        var n = f.n || 120;
        var weight = f.weight || 7.5;
        for (i = 0; i < n; i += 1) {
          if (hash(seed, i) > (f.share || 0.62)) continue;
          var a = (i / n) * Math.PI * 2 + (hash(seed, i + 300) - 0.5) * (Math.PI * 2 / n);
          var inner = 1 + 0.85 * Math.pow(hash(seed, i + 600), 2);
          var ix = cx + Math.cos(a) * rx * inner;
          var iy = cy + Math.sin(a) * ry * inner;
          var reach = diag * 1.2;
          var half = (weight * (0.3 + 0.7 * hash(seed, i + 900)) / 2) / reach;
          var ox1 = cx + Math.cos(a - half) * reach;
          var oy1 = cy + Math.sin(a - half) * reach;
          var ox2 = cx + Math.cos(a + half) * reach;
          var oy2 = cy + Math.sin(a + half) * reach;
          gr.appendChild(sv('path', { d: 'M' + ix.toFixed(1) + ',' + iy.toFixed(1) + 'L' + ox1.toFixed(1) + ',' + oy1.toFixed(1) + 'L' + ox2.toFixed(1) + ',' + oy2.toFixed(1) + 'Z' }));
        }
      } else if (f.k === 'speed') {
        var ang = (f.a || 180) * Math.PI / 180;
        var ux = Math.cos(ang);
        var uy = Math.sin(ang);
        var vx = -uy;
        var vy = ux;
        var count = f.n || 30;
        var clear = f.clear || [0.5, 0.5, 0];
        var ccx = box.x + box.w * clear[0];
        var ccy = box.y + box.h * clear[1];
        var cr = Math.min(box.w, box.h) * clear[2];
        for (i = 0; i < count; i += 1) {
          var sx = box.x + hash(seed, i) * box.w;
          var sy = box.y + hash(seed, i + 50) * box.h;
          var len = diag * (0.12 + hash(seed, i + 100) * 0.3);
          var wid = (f.weight || 5) * (0.35 + 0.65 * hash(seed, i + 150));
          var mx = sx + ux * len * 0.5;
          var my = sy + uy * len * 0.5;
          if (cr > 0 && Math.hypot(mx - ccx, my - ccy) < cr + len * 0.25) continue;
          var tx = sx + ux * len;
          var ty = sy + uy * len;
          gr.appendChild(sv('path', { d: 'M' + tx.toFixed(1) + ',' + ty.toFixed(1) + 'L' + (sx + vx * wid / 2).toFixed(1) + ',' + (sy + vy * wid / 2).toFixed(1) + 'L' + (sx - vx * wid / 2).toFixed(1) + ',' + (sy - vy * wid / 2).toFixed(1) + 'Z' }));
        }
      }
      s.appendChild(gr);
    });
    return s;
  }

  /* ------------------------------------------------------------------ *
   * BALLOONS. The words are HTML, so they wrap and read and zoom; the
   * shape is drawn round them once they are laid out.
   * ------------------------------------------------------------------ */
  function ellipsePoint(cx, cy, rx, ry, t) {
    return [cx + rx * Math.cos(t), cy + ry * Math.sin(t)];
  }
  function f1(n) { return n.toFixed(1); }
  function sayPath(cx, cy, rx, ry, tip) {
    var phi = Math.atan2((tip[1] - cy) / ry, (tip[0] - cx) / rx);
    var d = 0.2;
    var b1 = ellipsePoint(cx, cy, rx, ry, phi - d);
    var b2 = ellipsePoint(cx, cy, rx, ry, phi + d);
    var c1 = [b1[0] + (tip[0] - b1[0]) * 0.5, b1[1] + (tip[1] - b1[1]) * 0.5];
    var c2 = [b2[0] + (tip[0] - b2[0]) * 0.62, b2[1] + (tip[1] - b2[1]) * 0.62];
    var mx = (b1[0] + b2[0]) / 2;
    var my = (b1[1] + b2[1]) / 2;
    c1 = [c1[0] + (mx - c1[0]) * 0.18, c1[1] + (my - c1[1]) * 0.18];
    c2 = [c2[0] + (mx - c2[0]) * 0.1, c2[1] + (my - c2[1]) * 0.1];
    return 'M' + f1(b2[0]) + ',' + f1(b2[1]) +
      'A' + f1(rx) + ',' + f1(ry) + ' 0 1 1 ' + f1(b1[0]) + ',' + f1(b1[1]) +
      'Q' + f1(c1[0]) + ',' + f1(c1[1]) + ' ' + f1(tip[0]) + ',' + f1(tip[1]) +
      'Q' + f1(c2[0]) + ',' + f1(c2[1]) + ' ' + f1(b2[0]) + ',' + f1(b2[1]) + 'Z';
  }
  function cloudPath(cx, cy, rx, ry, seed) {
    var n = Math.max(9, Math.round((Math.PI * (rx + ry)) / 46));
    var pts = [];
    for (var i = 0; i < n; i += 1) {
      var t = (i / n) * Math.PI * 2 + (hash(seed, i) - 0.5) * 0.18;
      pts.push(ellipsePoint(cx, cy, rx, ry, t));
    }
    var dpath = 'M' + f1(pts[0][0]) + ',' + f1(pts[0][1]);
    for (var k = 0; k < n; k += 1) {
      var a = pts[k];
      var b = pts[(k + 1) % n];
      var chord = Math.hypot(b[0] - a[0], b[1] - a[1]);
      var r = chord * (0.56 + hash(seed, k + 40) * 0.12);
      dpath += 'A' + f1(r) + ',' + f1(r) + ' 0 0 1 ' + f1(b[0]) + ',' + f1(b[1]);
    }
    return dpath + 'Z';
  }
  function fitWords(pageEl) {
    var wpx = pageEl.offsetWidth;
    if (!wpx) return;
    var k = PAGE_W / wpx;
    var layer = pageEl.querySelector('svg.bubbles');
    if (!layer) return;
    while (layer.firstChild) layer.removeChild(layer.firstChild);
    pageEl.querySelectorAll('.bt').forEach(function (t) {
      var x = Number(t.dataset.x);
      var y = Number(t.dataset.y);
      var w = Number(t.dataset.w);
      var h = t.offsetHeight * k;
      t.style.top = px(y - h / 2, PAGE_H);
      var kind = t.dataset.kind;
      var rx = w / 2 * 1.2 + 16;
      var ry = h / 2 * 1.42 + 16;
      var tip = (t.dataset.tail || '').split(',').map(Number);
      if (kind === 'think') {
        layer.appendChild(sv('path', { d: cloudPath(x, y, rx + 6, ry + 6, t.textContent) }));
        if (tip.length === 2) {
          var ang = Math.atan2((tip[1] - y) / ry, (tip[0] - x) / rx);
          var edge = ellipsePoint(x, y, rx + 10, ry + 10, ang);
          [[0.34, 15], [0.62, 10], [0.86, 6.5]].forEach(function (b) {
            layer.appendChild(sv('circle', { cx: f1(edge[0] + (tip[0] - edge[0]) * b[0]), cy: f1(edge[1] + (tip[1] - edge[1]) * b[0]), r: b[1] }));
          });
        }
      } else {
        layer.appendChild(sv('path', { d: sayPath(x, y, rx, ry, tip.length === 2 ? tip : [x, y + ry + 40]) }));
      }
    });
  }

  /* ------------------------------------------------------------------ *
   * A PAGE.
   * ------------------------------------------------------------------ */
  function pictureOf(art) {
    var base = ASSETS + art;

  }
  function renderPanel(p, g, pageId) {
    var b = g.box;
    var fig = el(p.link ? 'div' : 'figure', 'panel');
    fig.style.left = px(b.x, PAGE_W);
    fig.style.top = px(b.y, PAGE_H);
    fig.style.width = px(b.w, PAGE_W);
    fig.style.height = px(b.h, PAGE_H);
    var q = g.quad;
    var pts = [];
    for (var i = 0; i < 4; i += 1) {
      pts.push(px(q[i * 2] - b.x, b.w) + ' ' + px(q[i * 2 + 1] - b.y, b.h));
    }
    fig.style.clipPath = 'polygon(' + pts.join(', ') + ')';
    fig.style.webkitClipPath = fig.style.clipPath;
    if (p.fill) fig.classList.add('fill-' + p.fill);
    if (p.look) fig.classList.add(p.look);
    if (p.art) {
      var pic = pictureOf(p.art);
      var img = new Image();
      img.alt = p.alt || '';
      img.decoding = 'async';
      img.draggable = false;
      if (p.focus) img.style.objectPosition = p.focus[0] + '% ' + p.focus[1] + '%';
      img.addEventListener('error', function () {

      a.href = '#' + p.link;
      a.setAttribute('aria-label', (p.alt || '') + ' Go to that page.');
      fig.appendChild(a);
    }
    return fig;
  }

  function renderWord(w, layers) {
    var node = null;
    if (w.k === 'letter') {
      layers.letters.appendChild(letter(w, layers.defs));
      node = el('span', 'sr', w.runs.map(function (r) { return r[0]; }).join(''));
      return node;
    }
    if (w.k === 'say' || w.k === 'think' || w.k === 'shout') {
      node = el('p', 'w bt', w.t);
      node.dataset.kind = w.k;
      node.dataset.x = w.x;
      node.dataset.y = w.y;
      node.dataset.w = w.w;
      if (w.tail) node.dataset.tail = w.tail.join(',');
      node.style.left = px(w.x - w.w / 2, PAGE_W);
      node.style.top = px(w.y, PAGE_H);
      node.style.width = px(w.w, PAGE_W);
      return node;
    }
    if (w.k === 'fly') {
      node = el('a', 'fly', w.t);
      node.href = w.href;
      node.setAttribute('aria-label', w.name || w.t);
      node.style.left = px(w.x, PAGE_W);
      node.style.top = px(w.y, PAGE_H);

    }
    if (w.k === 'note') {
      node = el('div', 'w note' + (w.small ? ' small' : ''));
      node.appendChild(el('span', 'd', w.d));
      node.appendChild(el('p', 't', w.t));
      node.querySelector('.t').style.margin = '0';
    } else if (w.k === 'tag') {
      node = el('p', 'w tag', w.t);
    } else if (w.k === 'head') {
      node = el('p', 'w head', w.t);
    } else if (w.k === 'sub') {
      node = el('p', 'w sub' + (w.tone === 'night' ? ' night' : '') + (w.center ? ' center' : ''), w.t);
    } else {
      node = el('p', 'w cap' + (w.big ? ' big' : ''), w.t);
    }
    node.style.left = px(w.x, PAGE_W);
    node.style.top = px(w.y, PAGE_H);
    if (w.w) node.style.width = px(w.w, PAGE_W);
    if (w.rot) node.style.transform = 'rotate(' + w.rot + 'deg)';
    return node;
  }

  function renderPage(entry) {
    var page = entry.page;
    var art = el('article', 'page tone-' + (page.tone || 'paper'));
    art.dataset.page = page.id;
    art.setAttribute('aria-label', page.label + ', ' + entry.where);
    var L = WebFPVLayout.layoutPage(page);
    var borders = sv('svg', { class: 'layer borders', viewBox: '0 0 ' + PAGE_W + ' ' + PAGE_H, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    var letters = sv('svg', { class: 'layer letters', viewBox: '0 0 ' + PAGE_W + ' ' + PAGE_H, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    var bubbles = sv('svg', { class: 'layer bubbles', viewBox: '0 0 ' + PAGE_W + ' ' + PAGE_H, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    var defs = sv('defs');
    letters.appendChild(defs);
    var layers = { letters: letters, defs: defs };
    var words = page.words || [];
    page.panels.forEach(function (p) {
      var g = L[p.id];
      if (!g) return;
      art.appendChild(renderPanel(p, g, page.id));
      if (p.frame !== 'none') {
        borders.appendChild(sv('polygon', { points: g.quad.map(function (v) { return v.toFixed(1); }).join(' ') }));
      }
      words.forEach(function (w) {
        if (w.in === p.id) art.appendChild(renderWord(w, layers));
      });
    });
    words.forEach(function (w) {
      if (!w.in) art.appendChild(renderWord(w, layers));
    });
    art.appendChild(borders);
    art.appendChild(letters);
    art.appendChild(bubbles);

    }

  }

  /* ------------------------------------------------------------------ *
   * THE BOOK.
   * ------------------------------------------------------------------ */
  var flat = [];
  CHAPTERS.forEach(function (ch) {
    var story = 0;
    ch.pages.forEach(function (p, i) {
      var folio = i === 0 ? 0 : (story += 1);
      flat.push({
        page: p,
        ch: ch,
        folio: folio,
        where: 'Chapter ' + ch.n + ', ' + (folio ? 'page ' + folio + ' of ' + (ch.pages.length - 1) : 'cover')
      });
    });
  });

  var bookEl = document.getElementById('book');
  var whereEl = document.getElementById('where');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var cache = {};
  var mode = '';
  var views = [];

  var turning = null;

  function pageEl(i) {

  function buildViews(m) {

    for (var i = 0; i < views.length; i += 1) {

    }
    return 0;
  }

  function firstPage(v) {
    var x = views[v];

  }

  function shiftFor(v) {
    if (mode === 'single') return 0;

    if (x[0] == null) return -pw / 2;
    if (x[1] == null) return pw / 2;

  }

  function fit() {

  }

  function slotsFor(v) {

    return [{ cls: 'slot left', i: x[0] }, { cls: 'slot right', i: x[1] }];

  function mount(container, i) {

    return p;
  }

  function show(v) {

    slotsFor(vi).forEach(function (s) {

    });

    });

  }

  function status() {

    var a = flat[x[0]];
    var text = a.ch.title + ' · ';
    if (x.length === 2) text += 'pages ' + flat[x[0]].folio + ' and ' + flat[x[1]].folio;

    nextBtn.disabled = vi >= views.length - 1;

  function prefetch() {

  /* One turn, as a progress from 0 to 1 that a drag or a timer moves. */
  function beginTurn(dir) {
    var to = vi + dir;
    if (to < 0 || to >= views.length) return null;
    var cur = views[vi];
    var nxt = views[to];
    bookEl.replaceChildren();
    var shift = el('div', 'shift');
    bookEl.appendChild(shift);
    var t = { dir: dir, to: to, shift: shift, from: shiftFor(vi), dest: shiftFor(to), p: 0 };
    if (mode === 'single') {
      var track = el('div', 'track');
      var a = el('div', 'slot single');
      var b = el('div', 'slot single');
      mount(a, cur[0]);
      mount(b, nxt[0]);
      b.style.transform = 'translateX(' + (dir > 0 ? pw + 24 : -pw - 24) + 'px)';
      track.appendChild(a);
      track.appendChild(b);
      shift.appendChild(track);
      t.track = track;
    } else {
      var under = dir > 0 ? [cur[0], nxt[1]] : [nxt[0], cur[1]];
      var leafFront = dir > 0 ? cur[1] : nxt[1];
      var leafBack = dir > 0 ? nxt[0] : cur[0];
      var left = el('div', 'slot left');
      var right = el('div', 'slot right');
      mount(left, under[0]);
      mount(right, under[1]);
      var leaf = el('div', 'leaf');
      var front = el('div', 'face front');
      var back = el('div', 'face back');
      mount(front, leafFront);
      mount(back, leafBack);
      front.appendChild(el('div', 'shade'));
      back.appendChild(el('div', 'shade'));
      leaf.appendChild(front);
      leaf.appendChild(back);
      var cast = el('div', 'cast');
      (dir > 0 ? right : left).appendChild(cast);
      shift.appendChild(left);
      shift.appendChild(right);
      shift.appendChild(leaf);
      t.leaf = leaf;
      t.front = front.querySelector('.shade');
      t.back = back.querySelector('.shade');
      t.cast = cast;
      t.castRight = dir > 0;
    }
    requestAnimationFrame(function () {
      bookEl.querySelectorAll('.page').forEach(fitWords);
    });
    turning = t;
    setTurn(t, 0);
    return t;
  }

  function setTurn(t, p) {
    t.p = p;
    var e = p;
    t.shift.style.transform = 'translateX(' + (t.from + (t.dest - t.from) * e).toFixed(1) + 'px)';
    if (t.track) {
      t.track.style.transform = 'translateX(' + (-(t.dir) * (pw + 24) * e).toFixed(1) + 'px)';
      return;
    }
    var angle = t.dir > 0 ? -180 * e : -180 * (1 - e);
    t.leaf.style.transform = 'rotateY(' + angle.toFixed(2) + 'deg)';
    var lift = Math.sin(Math.PI * e);
    t.front.style.opacity = (lift * 0.9).toFixed(3);
    t.back.style.opacity = (lift * 0.9).toFixed(3);
    var under = t.castRight ? 1 - e : e;
    t.cast.style.opacity = (under * 0.9 * (1 - Math.abs(0.5 - e))).toFixed(3);
  }

  function ease(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }

  function animateTurn(t, target, ms, done) {
    var from = t.p;
    var start = performance.now();
    var dur = Math.max(80, ms * Math.abs(target - from));
    function step(now) {
      if (turning !== t) return;
      var k = clamp((now - start) / dur, 0, 1);
      setTurn(t, from + (target - from) * ease(k));
      if (k < 1) requestAnimationFrame(step);
      else done();
    }
    requestAnimationFrame(step);
  }

  function go(dir) {
    if (turning) return;
    var to = vi + dir;
    if (to < 0 || to >= views.length) return;
    if (reduced) {
      show(to);
      rustle();
      return;
    }
    var t = beginTurn(dir);
    if (!t) return;
    animateTurn(t, 1, mode === 'spread' ? 760 : 420, function () {
      show(t.to);
      rustle();
    });
  }

  function jump(pageIndex) {
    if (turning) turning = null;
    show(viewOf(pageIndex));
  }

  /* Drag: a page follows the hand, and is let go either way. */
  var drag = null;
  bookEl.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || turning) return;
    if (e.target.closest('a, button')) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), moved: false, turn: null };
    try { bookEl.setPointerCapture(e.pointerId); } catch (err) { /* old browser */ }
  });
  bookEl.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x;
    var dy = e.clientY - drag.y;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < 10) return;
      if (Math.abs(dy) > Math.abs(dx) * 1.2) { drag = null; return; }
      drag.moved = true;
      bookEl.classList.add('dragging');
      if (!reduced) drag.turn = beginTurn(dx < 0 ? 1 : -1);
    }
    if (drag.turn) {
      var span = mode === 'spread' ? pw * 1.5 : pw;
      var p = clamp((drag.turn.dir > 0 ? -dx : dx) / span, 0, 1);
      setTurn(drag.turn, p);
    }
  });
  function endDrag(e) {
    if (!drag || (e.pointerId !== undefined && e.pointerId !== drag.id)) return;
    var d = drag;
    drag = null;
    bookEl.classList.remove('dragging');
    if (!d.moved) {
      var r = bookEl.getBoundingClientRect();
      go(e.clientX - r.left > r.width / 2 ? 1 : -1);
      return;
    }
    var dx = e.clientX - d.x;
    var dt = performance.now() - d.t;
    if (!d.turn) {
      if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
      return;
    }
    var fast = Math.abs(dx) / Math.max(1, dt) > 0.6;
    var commit = d.turn.p > 0.32 || (fast && d.turn.p > 0.05);
    var t = d.turn;
    animateTurn(t, commit ? 1 : 0, mode === 'spread' ? 640 : 360, function () {
      if (commit) {
        show(t.to);
        rustle();
      } else {
        show(vi);
      }
    });
  }
  bookEl.addEventListener('pointerup', endDrag);
  bookEl.addEventListener('pointercancel', function (e) {
    if (drag && drag.turn) {
      var t = drag.turn;
      drag = null;
      animateTurn(t, 0, 300, function () { show(vi); });
    } else {
      drag = null;
    }
  });
  bookEl.addEventListener('click', function (e) {
    var a = e.target.closest('a.go');
    if (!a) return;
    e.preventDefault();
    var id = a.getAttribute('href').slice(1);
    for (var i = 0; i < flat.length; i += 1) if (flat[i].page.id === id) jump(i);
  });

  prevBtn.addEventListener('click', function () { go(-1); });
  nextBtn.addEventListener('click', function () { go(1); });

  /* ------------------------------------------------------------------ *
   * CONTENTS, THE SCRIPT, FULL SCREEN, SOUND.
   * ------------------------------------------------------------------ */
  var contents = document.getElementById('contents');
  var contentsBtn = document.getElementById('contents-btn');
  var script = document.getElementById('script');
  var textBtn = document.getElementById('text-btn');
  var fullBtn = document.getElementById('full-btn');
  var soundBtn = document.getElementById('sound-btn');

  function buildContents() {
    contents.replaceChildren();
    CHAPTERS.forEach(function (ch) {
      contents.appendChild(el('h2', null, 'Chapter ' + ch.n + ' · ' + ch.title));
      var ol = el('ol');
      ch.pages.forEach(function (p) {
        var i = flat.findIndex(function (f) { return f.page === p; });
        var li = el('li');
        var a = el('a');
        a.href = '#' + p.id;
        a.appendChild(document.createTextNode(p.label));
        a.appendChild(el('span', null, flat[i].folio ? String(flat[i].folio) : 'cover'));
        a.addEventListener('click', function (e) {
          e.preventDefault();
          closeContents();
          jump(i);
        });
        li.appendChild(a);
        ol.appendChild(li);
      });
      contents.appendChild(ol);
    });
  }
  function markContents() {
    var shown = views[vi] || [];
    contents.querySelectorAll('a').forEach(function (a) {
      var id = a.getAttribute('href').slice(1);
      var i = flat.findIndex(function (f) { return f.page.id === id; });
      a.setAttribute('aria-current', shown.indexOf(i) >= 0 ? 'true' : 'false');
    });
  }
  function closeContents() {
    contents.hidden = true;
    contentsBtn.setAttribute('aria-expanded', 'false');
  }
  contentsBtn.addEventListener('click', function () {
    var open = contents.hidden;
    contents.hidden = !open;
    contentsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) markContents();
  });

  function buildScript() {
    var inner = script.querySelector('.in');
    inner.replaceChildren();
    CHAPTERS.forEach(function (ch) {
      inner.appendChild(el('h1', null, 'Chapter ' + ch.n + '. ' + ch.title + '.'));
      ch.pages.forEach(function (p) {
        inner.appendChild(el('h2', null, p.label));
        var words = p.words || [];
        p.panels.forEach(function (panel) {
          if (panel.frame === 'none') {
            /* a heading panel has no picture to describe */
          } else if (panel.alt) {
            inner.appendChild(el('p', 'alt', panel.alt));
          }
          words.forEach(function (w) {
            if (w.in !== panel.id) return;
            if (w.k === 'letter') inner.appendChild(el('p', 'fx', w.runs.map(function (r) { return r[0]; }).join('')));
            else if (w.k === 'say' || w.k === 'think' || w.k === 'shout') inner.appendChild(el('p', 'said', w.t));
            else if (w.k === 'note') inner.appendChild(el('p', null, w.d + ': ' + w.t));
            else if (w.k === 'fly') {
              var a = el('a', 'fly', w.t);
              a.href = w.href;
              a.setAttribute('aria-label', w.name || w.t);
              inner.appendChild(a);
            } else inner.appendChild(el('p', null, w.t));
          });
        });
      });
      if (ch.sources) {
        inner.appendChild(el('h2', null, 'Sources'));
        ch.sources.forEach(function (s) { inner.appendChild(el('p', 'alt', s)); });
      }
    });
  }
  function setText(on) {
    script.hidden = !on;
    textBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    textBtn.textContent = on ? 'Show pages' : 'Read as text';
    if (on) script.scrollTop = 0;
    try { localStorage.setItem('webfpv-comic-text', on ? '1' : '0'); } catch (e) { /* private mode */ }
  }
  textBtn.addEventListener('click', function () { setText(script.hidden); });

  fullBtn.addEventListener('click', function () {
    var d = document;
    if (d.fullscreenElement) { if (d.exitFullscreen) d.exitFullscreen(); return; }
    var r = d.documentElement;
    if (r.requestFullscreen) r.requestFullscreen().catch(function () {});
  });
  document.addEventListener('fullscreenchange', function () {
    fullBtn.textContent = document.fullscreenElement ? 'Leave full screen' : 'Full screen';
  });

  var soundOn = false;
  var audio = null;
  function rustle() {
    if (!soundOn) return;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audio) audio = new Ctx();
    var dur = 0.16;
    var rate = audio.sampleRate;
    var buf = audio.createBuffer(1, Math.floor(rate * dur), rate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < data.length; i += 1) {
      var t = i / data.length;
      data[i] = (hash('rustle', i) * 2 - 1) * Math.pow(1 - t, 2.2) * 0.2;
    }
    var src = audio.createBufferSource();
    src.buffer = buf;
    var filter = audio.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1700;
    filter.Q.value = 0.6;
    src.connect(filter);
    filter.connect(audio.destination);
    src.start();
  }
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    try { localStorage.setItem('webfpv-comic-sound', soundOn ? '1' : '0'); } catch (e) { /* private mode */ }
    if (soundOn) rustle();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!contents.hidden) { closeContents(); return; }
      if (!script.hidden) { setText(false); return; }
      return;
    }
    if (!script.hidden) return;
    var onControl = e.target.closest && e.target.closest('a, button');
    if (onControl && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
    else if (e.key === 'Home') { e.preventDefault(); jump(0); }
    else if (e.key === 'End') { e.preventDefault(); jump(flat.length - 1); }
  });

  function startPage() {
    var id = (location.hash || '').slice(1);
    for (var i = 0; i < flat.length; i += 1) if (flat[i].page.id === id) return i;
    return 0;
  }
  window.addEventListener('hashchange', function () {
    var i = startPage();
    if (views.length && views[vi].indexOf(i) < 0) jump(i);
  });

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fit, 80);
  });

  /* The mark in the bar, in the same hand. */
  (function () {
    var host = document.getElementById('mark');
    var s = sv('svg', { viewBox: '0 0 300 80', 'aria-hidden': 'true' });
    var defs = sv('defs');
    s.appendChild(defs);
    s.appendChild(letter({ x: 8, y: 60, size: 64, anchor: 'start', runs: [['WEB', 'cream'], ['FPV', 'sakura']] }, defs));
    host.appendChild(s);
  })();

  buildContents();
  buildScript();
  try {
    if (localStorage.getItem('webfpv-comic-sound') === '1') { soundOn = true; soundBtn.setAttribute('aria-pressed', 'true'); }
    if (localStorage.getItem('webfpv-comic-text') === '1') setText(true);
  } catch (e) { /* private mode */ }
  fit();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      bookEl.querySelectorAll('.page').forEach(fitWords);
    });
  }
  window.__comic = { flat: flat, go: go, jump: jump, get view() { return views[vi]; }, get mode() { return mode; } };
})();
</script>
<!--
MAINTAINERS
The book is three files: docs/index.html draws it, docs/layout.js cuts
its pages, docs/chapters.js is the story. To add a chapter, append one
object to CHAPTERS and put its pictures in docs/assets/chapters/<id>/ as
<name>@1x.webp and <name>@2x.webp (tools/shoot and tools/ink make them).
Every panel needs an alt, every line of words a source in STORYBOARD.md.
The last page keeps the one link to https://webfpv.org/sim/.
-->
</body>
</html>
