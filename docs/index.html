  <article class="noscript-book">
    <h1>WEBFPV</h1>
    <p>andAgainFPV. A pilot since 2020. It started as curiosity.</p>
    <img src="assets/chapters/c1/gate-cover@1x.webp" alt="Colour first person view. A mint race gate fills the glass, the distance reading 10 m. Sky, trees and grass stay in colour. The crash notice is outside this crop.">
    <h2>The question</h2>
    <img src="assets/chapters/c1/gate-approach@1x.webp" alt="Colour approach. A mint gate ahead on the grass. The glass reads 14 m, 8 km/h, 2.0 m, ANGLE.">
    <p>Could I compile Betaflight, put it in a virtual world, in a browser, and fly decent?</p>
    <img src="assets/chapters/c1/gate-fast@1x.webp" alt="Colour, low and fast. The glass reads 10 m and 30 km/h. The crash notice is cropped off.">
    <p>The day the answer was yes, I decided to see how far it could go. It was a project.</p>
    <h2>For me</h2>
    <img src="assets/chapters/c1/gate-level@1x.webp" alt="Colour, closer and level. The glass reads 12 m, 12 km/h, 1.3 m.">
    <p>First it was for me. A sim that was easy to fly. For my kids, and for me.</p>
    <img src="assets/chapters/c1/gate-sit@1x.webp" alt="Colour. The quad sits on the grass at 0 km/h. A mint gate is still ahead.">
    <p>Too fast. It flew. Not a clean lap. Decent enough to keep going.</p>
    <h2>For anyone</h2>
    <img src="assets/chapters/c1/gate-miss@1x.webp" alt="Colour. The line misses. The gate edge sits at the bottom of the glass. The glass reads 5 m and 1 bounce.">
    <p>Most school kids have no money, and they usually cannot install anything on their computers. So they have no sim.</p>
    <img src="assets/chapters/c1/gate-tip@1x.webp" alt="Colour. The horizon tips. Sky on one side, the field on the other. A gate marker reads 11 m off to the side.">
    <p>I wanted it for anyone who could not buy a VelociDrone, or anything like it. Free. No install. No account.</p>
    <h2>Their game</h2>
    <img src="assets/chapters/c1/builder-worlds@1x.webp" alt="The track builder asks what you are building, and shows three colour pictures: a grass race field, a small room with a green gate, and a town of roofs and wires.">
    <p>What I am proudest of is the map and track builder. People can make their own game.</p>
    <h2>The feel</h2>
    <img src="assets/chapters/c1/whoop-room@1x.webp" alt="The whoop room from the builder: a small indoor space, a green gate, and a sign that reads WEBFPV.">
    <p>What nearly made me quit was the feel. A real whoop and the sim. It is different. But how?</p>
    <h2>Next</h2>
    <img src="assets/chapters/c1/town@1x.webp" alt="The freestyle town from the builder: roofs, wires, and pink blossom.">
    <p>The game keeps building. The next chapter is the next thing that ships.</p>
    <p><a href="https://webfpv.org/sim/">Fly WebFPV</a></p>
  </article>

  }
  var stack = document.createElement("div");
  stack.className = "panels";
  page.panels.forEach(function (panel) {
    var fig = document.createElement("figure");
    fig.className = "panel" + (panel.tone === "dark" ? " tone-dark" : "") + (panel.fit === "contain" ? " fit-contain" : "") + (panel.frame === "band" ? " frame-band" : "");
    fig.id = panel.id;
    if (panel.src) {
      var img = document.createElement("img");
      var hi = panel.src.replace("@1x", "@2x");
      img.src = panel.src;
      img.srcset = panel.src + " 1x, " + hi + " 2x";
      img.alt = panel.alt;
      img.draggable = false;
      if (panel.position) img.style.objectPosition = panel.position;
      img.decoding = page.cover ? "sync" : "async";
      fig.appendChild(img);
    }
    if (page.cover) {
      var mark = document.createElement("p");
      mark.className = "cover-mark";
      var web = document.createElement("span");
      web.textContent = "WEB";
      var fpv = document.createElement("span");
      fpv.className = "logo-fpv";
      fpv.textContent = "FPV";
      mark.appendChild(web);
      mark.appendChild(fpv);
      fig.appendChild(mark);
    }
    (panel.balloons || []).forEach(function (b) {
      var balloon = document.createElement("p");
      balloon.className = "balloon";
      balloon.style.left = b.x + "%";
      balloon.style.top = b.y + "%";
      balloon.setAttribute("aria-hidden", "true");
      balloon.textContent = b.text;
      fig.appendChild(balloon);
    });
    if (panel.caption) {
      var cap = document.createElement("figcaption");
      cap.className = "caption";
      cap.textContent = panel.caption;
      fig.appendChild(cap);
    }
    var transcript = document.createElement("p");
    transcript.className = "transcript";
    transcript.textContent = panel.transcript;
    fig.appendChild(transcript);
    stack.appendChild(fig);
  });
  art.appendChild(stack);
  if (page.fly) {
    var row = document.createElement("div");
    row.className = "fly-row";
    var a = document.createElement("a");
    a.className = "fly";
    a.href = page.fly.href;
    a.setAttribute("aria-label", page.fly.name);
    a.textContent = page.fly.label;
    row.appendChild(a);
    art.appendChild(row);
  }
  if (page.folio) {
    var folio = document.createElement("p");
    folio.className = "folio";
    folio.textContent = page.folio;
    art.appendChild(folio);
  }
  return art;
}

function fit() {
  var stage = document.getElementById("stage");
  var rect = stage.getBoundingClientRect();
  var availW = Math.max(160, rect.width - 8);
  var availH = Math.max(160, rect.height - 8);
  var pageH = availW * 1.62;
  var pageW = availW;
  if (pageH > availH) {
    pageH = availH;
    pageW = pageH / 1.62;
  }
  book.style.width = pageW + "px";
  book.style.height = pageH + "px";
}

function whereText(page) {
  if (page.kicker) return page.kicker + ", " + page.where;
  return page.where;
}

function paint() {
  var page = pages[pageIndex];
  sheet.replaceChildren(pageEl(page));
  sheet.style.transition = "none";
  sheet.style.transform = "none";
  under.style.transition = "none";
  under.style.transform = "none";
  under.replaceChildren();
  fit();
  whereEl.textContent = whereText(page);
  prevBtn.disabled = pageIndex <= 0;
  nextBtn.disabled = pageIndex >= pages.length - 1;
  if (location.hash !== "#" + page.id) history.replaceState(null, "", "#" + page.id);
  preloadAround();
}

function preloadAround() {
  [-1, 0, 1].forEach(function (delta) {
    var page = pages[pageIndex + delta];
    if (!page) return;
    page.panels.forEach(function (panel) {
      if (!panel.src) return;
      var img = new Image();
      img.src = panel.src;
    });
  });
}

function can(dir) {
  var next = pageIndex + dir;
  return next >= 0 && next < pages.length;
}

function rustle() {
  if (!soundOn) return;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  if (!audioCtx) audioCtx = new Ctx();
  var dur = 0.12;
  var rate = audioCtx.sampleRate;
  var buf = audioCtx.createBuffer(1, Math.floor(rate * dur), rate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < data.length; i++) {
    var t = i / data.length;
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2) * 0.18;
  }
  var src = audioCtx.createBufferSource();
  src.buffer = buf;
  var filter = audioCtx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 1400;
  filter.Q.value = 0.7;
  src.connect(filter);
  filter.connect(audioCtx.destination);
  src.start();
}

function showUnder(dir) {
  var page = pages[pageIndex + dir];
  if (!page) {
    under.replaceChildren();
    under.style.transform = "none";
    return;
  }
  under.replaceChildren(pageEl(page));
  var width = sheet.getBoundingClientRect().width || book.getBoundingClientRect().width || 320;
  under.style.transition = "none";
  under.style.transform = "translateX(" + (dir > 0 ? width : -width) + "px)";
}

function finishIndex(next, token) {
  if (token !== anim) return;
  pageIndex = next;
  paint();
  rustle();
}

function slideTo(dir) {
  if (!can(dir)) return;
  var next = pageIndex + dir;
  anim += 1;
  var token = anim;
  if (!motion) {
    finishIndex(next, token);
    return;
  }
  showUnder(dir);
  var width = sheet.getBoundingClientRect().width || book.getBoundingClientRect().width || 320;
  var end = dir > 0 ? -width : width;
  var ease = "transform 320ms cubic-bezier(.2,.7,.2,1)";
  sheet.style.transition = "none";
  void under.offsetWidth;
  sheet.style.transition = ease;
  under.style.transition = ease;
  sheet.style.transform = "translateX(" + end + "px)";
  under.style.transform = "translateX(0px)";
  var done = false;
  function complete() {
    if (done) return;
    done = true;
    sheet.removeEventListener("transitionend", onEnd);
    finishIndex(next, token);
  }
  function onEnd(e) {
    if (e.target === sheet && e.propertyName === "transform") complete();
  }
  sheet.addEventListener("transitionend", onEnd);
  setTimeout(complete, 420);
}

function jumpTo(index) {
  if (index < 0 || index >= pages.length || index === pageIndex) return;
  anim += 1;
  pageIndex = index;
  paint();
}

function goToId(id) {
  contentsEl.hidden = true;
  contentsBtn.setAttribute("aria-expanded", "false");
  var idx = 0;
  for (var i = 0; i < pages.length; i++) if (pages[i].id === id) idx = i;
  if (idx === pageIndex) return;
  if (Math.abs(idx - pageIndex) === 1) slideTo(idx > pageIndex ? 1 : -1);
  else jumpTo(idx);
}

function buildContents() {
  contentsEl.replaceChildren();
  var title = document.createElement("p");
  title.className = "contents-title";
  title.textContent = "Contents";
  contentsEl.appendChild(title);
  CHAPTERS.forEach(function (ch) {
    var head = document.createElement("p");
    head.className = "contents-chapter";
    head.textContent = ch.title;
    contentsEl.appendChild(head);
    ch.pages.forEach(function (p) {
      var a = document.createElement("a");
      a.href = "#" + p.id;
      a.textContent = p.contentsLabel;
      a.addEventListener("click", function (e) {
        e.preventDefault();
        goToId(p.id);
      });
      contentsEl.appendChild(a);
    });
  });
}

function setMotion(on) {
  motion = on;
  motionBtn.setAttribute("aria-pressed", on ? "true" : "false");
  motionBtn.textContent = on ? "Motion on" : "Motion off";
  document.body.classList.toggle("still", !on);
}

function onKey(e) {
  var tag = e.target && e.target.closest ? e.target.closest("a, button, input, textarea") : null;
  if (e.key === "Escape") {
    contentsEl.hidden = true;
    contentsBtn.setAttribute("aria-expanded", "false");
    if (document.body.classList.contains("as-text")) {
      document.body.classList.remove("as-text");
      textBtn.setAttribute("aria-pressed", "false");
      textBtn.textContent = "Read as text";
    }
    return;
  }
  if (tag && (e.key === " " || e.key === "Enter")) return;
  if (contentsEl.hidden === false && (e.key === "ArrowDown" || e.key === "ArrowUp")) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
    e.preventDefault();
    slideTo(1);
  } else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") {
    e.preventDefault();
    slideTo(-1);
  } else if (e.key === "Home") {
    e.preventDefault();
    jumpTo(0);
  } else if (e.key === "End") {
    e.preventDefault();
    jumpTo(pages.length - 1);
  }
}

book.addEventListener("pointerdown", function (e) {
  if (e.button !== undefined && e.button !== 0) return;
  if (e.target.closest("a, button")) return;
  e.preventDefault();
  anim += 1;
  var rect = book.getBoundingClientRect();
  drag = {
    id: e.pointerId,
    x: e.clientX,
    y: e.clientY,
    rect: rect,
    moved: false,
    dir: 0,
    width: rect.width
  };
  sheet.style.transition = "none";
  under.style.transition = "none";
  if (book.setPointerCapture) {
    try { book.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }
});

book.addEventListener("pointermove", function (e) {
  if (!drag || e.pointerId !== drag.id) return;
  var dx = e.clientX - drag.x;
  var dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 8) return;
  drag.moved = true;
  if (!drag.dir) {
    drag.dir = dx < 0 ? 1 : -1;
    if (can(drag.dir)) showUnder(drag.dir);
  }
  var shown = dx;
  if ((drag.dir > 0 && dx > 0) || (drag.dir < 0 && dx < 0)) shown = 0;
  if (!can(drag.dir)) shown = dx * 0.12;
  else if (drag.dir > 0) shown = Math.min(0, shown);
  else shown = Math.max(0, shown);
  sheet.style.transform = "translateX(" + shown + "px)";
  if (can(drag.dir)) {
    var underX = drag.dir > 0 ? drag.width + shown : -drag.width + shown;
    under.style.transform = "translateX(" + underX + "px)";
  }
});

function endDrag(e) {
  if (!drag || (e && e.pointerId !== undefined && e.pointerId !== drag.id)) return;
  var d = drag;
  drag = null;
  var dx = (e && e.clientX !== undefined ? e.clientX : d.x) - d.x;
  if (!d.moved) {
    var localX = d.x - d.rect.left;
    slideTo(localX > d.rect.width / 2 ? 1 : -1);
    return;
  }
  var commit = d.dir && can(d.dir) && Math.abs(dx) > d.width * 0.22;
  var ease = "transform 200ms ease";
  if (!commit) {
    anim += 1;
    sheet.style.transition = ease;
    under.style.transition = ease;
    sheet.style.transform = "none";
    under.style.transform = "translateX(" + (d.dir > 0 ? d.width : -d.width) + "px)";
    setTimeout(function () { if (!drag) under.replaceChildren(); }, 220);
    return;
  }
  anim += 1;
  var token = anim;
  var next = pageIndex + d.dir;
  var end = d.dir > 0 ? -d.width : d.width;
  sheet.style.transition = ease;
  under.style.transition = ease;
  sheet.style.transform = "translateX(" + end + "px)";
  under.style.transform = "translateX(0px)";
  setTimeout(function () { finishIndex(next, token); }, 230);
}

book.addEventListener("pointerup", endDrag);
book.addEventListener("pointercancel", endDrag);

prevBtn.addEventListener("click", function () { slideTo(-1); });
nextBtn.addEventListener("click", function () { slideTo(1); });
contentsBtn.addEventListener("click", function () {
  var open = contentsEl.hidden;
  contentsEl.hidden = !open;
  contentsBtn.setAttribute("aria-expanded", open ? "true" : "false");
});
textBtn.addEventListener("click", function () {
  var on = !document.body.classList.contains("as-text");
  document.body.classList.toggle("as-text", on);
  textBtn.setAttribute("aria-pressed", on ? "true" : "false");
  textBtn.textContent = on ? "Show pictures" : "Read as text";
  writeStore("webfpv-book-text", on ? "1" : "0");
});
motionBtn.addEventListener("click", function () {
  setMotion(!motion);
  writeStore("webfpv-book-motion", motion ? "1" : "0");
});
soundBtn.addEventListener("click", function () {
  soundOn = !soundOn;
  soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
  soundBtn.textContent = soundOn ? "Sound on" : "Sound off";
  writeStore("webfpv-book-sound", soundOn ? "1" : "0");
  if (soundOn) rustle();
});
document.addEventListener("keydown", onKey);
window.addEventListener("resize", function () { fit(); });

var storedMotion = readStore("webfpv-book-motion");
if (storedMotion === "0" || (storedMotion === null && prefersStill())) setMotion(false);
else setMotion(true);
if (readStore("webfpv-book-text") === "1") {
  document.body.classList.add("as-text");
  textBtn.setAttribute("aria-pressed", "true");
  textBtn.textContent = "Show pictures";
}
if (readStore("webfpv-book-sound") === "1") {
  soundOn = true;
  soundBtn.setAttribute("aria-pressed", "true");
  soundBtn.textContent = "Sound on";
}

buildContents();
var start = (location.hash || "").replace("#", "");
for (var i = 0; i < pages.length; i++) if (pages[i].id === start) pageIndex = i;
window.addEventListener("hashchange", function () {
  var id = (location.hash || "").replace("#", "");
  var idx = -1;
  for (var n = 0; n < pages.length; n++) if (pages[n].id === id) idx = n;
  if (idx >= 0 && idx !== pageIndex) jumpTo(idx);
});

book.hidden = false;
paint();
</script>
<!--
MAINTAINERS
The book is this file. Chapter data is the CHAPTERS array above.
Pictures stay in colour. Words stay in caption fields, not baked into the art.
One page shows at a time. Next slides the page off. It does not use a 3D curl.
To add a chapter, append one object and the pictures.
Each panel needs an id, an alt, a caption, and a transcript.
The last page keeps one link to https://webfpv.org/sim/.
Colour frames: node tools/ink/color.js
Fonts are SIL Open Font License 1.1. Comic Neue, copyright 2014 The
Comic Neue Project Authors. Literata, copyright 2017 The Literata
