name: candidates
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
permissions:
  issues: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check/candidates.js
        env:
          OPEN_ISSUE: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
